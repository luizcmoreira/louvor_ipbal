<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ministério de Louvor — IP Arthur Lundgren I</title>
<style>
  :root {
    /* Verde e Cinza são as cores institucionais da IPB (Pantone 350C e Cool
       Gray/Black C no manual de identidade visual). */
    --bg: #f5f7f4;
    --surface: #ffffff;
    --surface-alt: #eef2ec;
    --text: #1c2620;
    --muted: #5c665f;
    --green: #1e6b3f;
    --green-dark: #164f2f;
    --green-soft: rgba(30, 107, 63, 0.08);
    --border: #dde3da;
    --shadow: 0 1px 3px rgba(20, 30, 20, 0.06), 0 8px 24px rgba(20, 30, 20, 0.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 20px 32px;
  }
  .wrap { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; }

  .logo {
    width: 84px; height: 84px; object-fit: contain; margin-bottom: 18px;
  }
  .eyebrow {
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--green); margin: 0 0 6px;
  }
  h1 {
    font-size: 1.4rem; font-weight: 700; text-align: center; line-height: 1.3;
    margin: 0 0 4px; color: var(--text);
  }
  .subtitle {
    font-size: 0.92rem; color: var(--muted); text-align: center; margin: 0 0 36px;
  }

  nav { width: 100%; display: flex; flex-direction: column; gap: 14px; }

  .card {
    display: flex; align-items: center; gap: 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 18px 18px; text-decoration: none; color: var(--text);
    box-shadow: var(--shadow);
    transition: transform .12s ease, border-color .12s ease;
  }
  .card:active { transform: scale(0.98); }
  .card.primary { border-color: var(--green); }
  .card.primary:active { background: var(--green-soft); }

  .card-icon {
    flex-shrink: 0; width: 46px; height: 46px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 1.35rem;
  }
  .card.primary .card-icon { background: var(--green-soft); color: var(--green); }
  .card.secondary .card-icon { background: var(--surface-alt); color: var(--muted); }

  .card-title { font-size: 1.02rem; font-weight: 700; margin: 0 0 2px; }
  .card-desc { font-size: 0.82rem; color: var(--muted); margin: 0; line-height: 1.35; }
  .card-arrow { margin-left: auto; color: var(--muted); font-size: 1.1rem; flex-shrink: 0; }

  .card.secondary { padding: 14px 18px; }
  .card.secondary .card-title { font-size: 0.92rem; }

  footer { margin-top: auto; padding-top: 40px; font-size: 0.76rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>

<div class="wrap">
  <img src="logo-ipb.png" class="logo" alt="Igreja Presbiteriana do Brasil" onerror="this.style.display='none'">
  <p class="eyebrow">Ministério de Louvor</p>
  <h1>Igreja Presbiteriana<br>Arthur Lundgren I</h1>
  <p class="subtitle">Escolha o que você precisa</p>

  <nav>
    <a class="card primary" href="cifras.html">
      <div class="card-icon">🎵</div>
      <div>
        <p class="card-title">Cifras</p>
        <p class="card-desc">Repertório com transposição de tom por cantor</p>
      </div>
      <span class="card-arrow">›</span>
    </a>

    <a class="card secondary" href="admin.html">
      <div class="card-icon">⚙️</div>
      <div>
        <p class="card-title">Cadastrar música</p>
      </div>
      <span class="card-arrow">›</span>
    </a>
  </nav>

  <footer>IP Arthur Lundgren I</footer>
</div>

</body>
</html>
