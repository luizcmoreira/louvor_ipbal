<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escala — Ministério de Louvor</title>
<style>
  :root {
    --bg: #f5f7f4; --card: #ffffff; --card-2: #eef2ec; --text: #1c2620; --muted: #5c665f;
    --accent: #1e6b3f; --accent-on: #ffffff; --border: #dde3da;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); padding-bottom:40px; }
  header { padding:14px 16px 12px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:6px; }
  .home-link { display:inline-flex; align-items:center; gap:4px; color:var(--accent); text-decoration:none; font-size:0.82rem; font-weight:700; }
  .header-row { display:flex; align-items:center; justify-content:space-between; }
  h1 { font-size:1.05rem; margin:0; }
  .add-link { font-size:0.82rem; font-weight:700; color:var(--accent); text-decoration:none; border:1px solid var(--border); padding:6px 12px; border-radius:20px; background:none; cursor:pointer; }
  main { padding:16px; display:flex; flex-direction:column; gap:14px; max-width:520px; margin:0 auto; }

  .calendar-box {
    background:var(--card); border:1px solid var(--border); border-radius:16px; padding:14px;
    box-shadow:0 1px 3px rgba(20,30,20,0.05);
  }
  .cal-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cal-header span { font-weight:700; font-size:0.92rem; text-transform:capitalize; }
  .cal-nav-btn {
    width:30px; height:30px; border-radius:50%; border:1px solid var(--border); background:var(--card-2);
    color:var(--text); font-size:1rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .cal-grid { display:grid; grid-template-columns:repeat(7, minmax(0,1fr)); gap:3px; }
  .cal-dow { min-width:0; text-align:center; font-size:0.68rem; font-weight:700; color:var(--muted); padding-bottom:4px; }
  .cal-day {
    min-width:0; aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    border-radius:8px; font-size:0.8rem; color:var(--text); position:relative;
  }
  .cal-day.empty { visibility:hidden; }
  .cal-day.today { background:var(--card-2); font-weight:700; }
  .cal-day.marked { cursor:pointer; font-weight:700; }
  .cal-day.has-culto { background:rgba(37,99,168,0.14); color:#2563a8; }
  .cal-day.has-ensaio { background:rgba(178,63,63,0.14); color:#b23f3f; }
  .cal-day.has-culto.has-ensaio { background:linear-gradient(135deg, rgba(37,99,168,0.18) 50%, rgba(178,63,63,0.18) 50%); color:var(--text); }
  .cal-day.marked.past { opacity:0.55; }
  .cal-dots { display:flex; gap:2px; margin-top:1px; }
  .cal-dot { width:5px; height:5px; border-radius:50%; }
  .cal-dot.culto { background:#2563a8; }
  .cal-dot.ensaio { background:#b23f3f; }

  .culto {
    background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px;
    box-shadow:0 1px 3px rgba(20,30,20,0.05);
  }
  .culto.past { opacity:0.72; }
  .culto-date { font-size:0.78rem; font-weight:700; color:var(--accent); text-transform:capitalize; }
  .culto-label { font-size:1.02rem; font-weight:700; margin:2px 0 12px; }
  .role-row { display:flex; gap:8px; margin-bottom:6px; font-size:0.85rem; }
  .role-tag { font-weight:700; color:var(--muted); flex-shrink:0; width:78px; }
  .role-val { color:var(--text); }
  .rep-ordered { margin-top:10px; padding-top:10px; border-top:1px solid var(--border); }
  .rep-section-title { font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--muted); margin:10px 0 4px; }
  .rep-section-title:first-child { margin-top:0; }
  .rep-song-row {
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:8px 10px; border-radius:10px; background:var(--card-2); margin-bottom:6px;
    text-decoration:none; color:var(--text); font-size:0.86rem;
  }
  .rep-song-tone { font-weight:700; color:var(--accent); font-size:0.8rem; flex-shrink:0; }
  .empty { text-align:center; color:var(--muted); font-size:0.9rem; padding:40px 20px; }
  .section-list { display:flex; flex-direction:column; gap:14px; }
  .history-toggle {
    width:100%; text-align:center; background:var(--card-2); border:1px dashed var(--border);
    border-radius:12px; padding:12px; font-size:0.85rem; font-weight:600; color:var(--muted); cursor:pointer;
  }
</style>
</head>
<script src="config.js"></script>
<body>

<header>
  <a class="home-link" href="index.html">← Início</a>
  <div class="header-row">
    <h1>Escala</h1>
    <a class="add-link" href="admin-escala.html">+ Novo culto</a>
  </div>
</header>

<main>
  <div class="calendar-box">
    <div class="cal-header">
      <button type="button" id="cal-prev" class="cal-nav-btn">‹</button>
      <span id="cal-month-label"></span>
      <button type="button" id="cal-next" class="cal-nav-btn">›</button>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
  </div>

  <div id="upcoming-list" class="section-list"></div>
  <button type="button" id="history-toggle-btn" class="history-toggle" style="display:none;"></button>
  <div id="history-list" class="section-list" style="display:none;"></div>
</main>

<script>
let lastEscala = [];
let lastByTitle = {};
let calDate = new Date();
let historyOpen = false;

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

async function load() {
  const upcomingEl = document.getElementById("upcoming-list");
  upcomingEl.innerHTML = "<p style='color:var(--muted);padding:8px 0;'>Carregando…</p>";
  let escala, songs;
  try {
    [escala, songs] = await Promise.all([
      fetch(API_URL + "?sheet=Escala", { cache: "no-store" }).then(r => r.json()),
      fetch(API_URL + "?sheet=Musicas", { cache: "no-store" }).then(r => r.json()),
    ]);
  } catch (e) {
    upcomingEl.innerHTML = "<p style='color:#b23f3f'>Não consegui carregar a escala.</p>";
    return;
  }

  lastEscala = escala;
  lastByTitle = Object.fromEntries(songs.map(s => [s.title, s]));

  renderCalendar();
  renderLists();
}
load();

// ── Calendário do mês — marca os dias que têm culto, clicar rola até o card ──
function renderCalendar() {
  const monthNames = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
  const year = calDate.getFullYear();
  const month = calDate.getMonth();
  document.getElementById("cal-month-label").textContent = `${monthNames[month]} ${year}`;

  const firstWeekday = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = todayStr();
  const byDate = Object.fromEntries(lastEscala.map(c => [c.date, c]));
  const byEnsaio = Object.fromEntries(lastEscala.filter(c => c.ensaioData).map(c => [c.ensaioData, c]));

  const dows = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
  let html = dows.map(d => `<div class="cal-dow">${d}</div>`).join("");
  for (let i = 0; i < firstWeekday; i++) html += `<div class="cal-day empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const culto = byDate[dateStr];
    const ensaio = byEnsaio[dateStr];
    const isToday = dateStr === today;
    const cls = ["cal-day"];
    if (isToday) cls.push("today");
    if (culto) cls.push("marked", "has-culto");
    if (ensaio) cls.push("marked", "has-ensaio");
    if ((culto || ensaio) && dateStr < today) cls.push("past");
    const dots = (culto ? '<span class="cal-dot culto"></span>' : "") + (ensaio ? '<span class="cal-dot ensaio"></span>' : "");
    html += `<div class="${cls.join(" ")}" data-date="${dateStr}" data-culto-date="${culto ? dateStr : ""}"><span>${d}</span>${dots ? `<span class="cal-dots">${dots}</span>` : ""}</div>`;
  }
  const grid = document.getElementById("cal-grid");
  grid.innerHTML = html;
  grid.querySelectorAll(".cal-day.marked").forEach(cell => {
    cell.addEventListener("click", () => {
      const dateStr = cell.dataset.cultoDate;
      if (!dateStr) return;
      if (dateStr < today && !historyOpen) toggleHistory();
      setTimeout(() => {
        const el = document.getElementById("culto-" + encodeURIComponent(dateStr));
        if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      }, historyOpen ? 50 : 150);
    });
  });
}

document.getElementById("cal-prev").addEventListener("click", () => {
  calDate = new Date(calDate.getFullYear(), calDate.getMonth() - 1, 1);
  renderCalendar();
});
document.getElementById("cal-next").addEventListener("click", () => {
  calDate = new Date(calDate.getFullYear(), calDate.getMonth() + 1, 1);
  renderCalendar();
});

// Repertório é uma lista ORDENADA de {type:"song"|"header", text} — headers
// (ex: "Prelúdio") viram um rótulo e a numeração das músicas recomeça a
// cada seção.
function renderRepertorio(items, ministro) {
  if (!items || items.length === 0) return "";
  let songNum = 0;
  const rows = items.map(item => {
    if (item.type === "header") {
      songNum = 0;
      return `<div class="rep-section-title">${item.text}</div>`;
    }
    songNum++;
    const song = lastByTitle[item.text];
    const tone = song ? (song.presets?.[ministro] || song.originalKey || "") : "";
    const href = `cifras.html?song=${encodeURIComponent(item.text)}&singer=${encodeURIComponent(ministro || "")}`;
    return `<a class="rep-song-row" href="${href}"><span>${songNum}. ${item.text}</span>${tone ? `<span class="rep-song-tone">${tone}</span>` : ""}</a>`;
  }).join("");
  return `<div class="rep-ordered">${rows}</div>`;
}

// ── Listas: próximos cultos direto na tela, passados escondidos no histórico ──
function cultoCardHtml(c, isPast) {
  const dateLabel = new Date(c.date + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
  const rep = renderRepertorio(c.repertorio, c.ministro);
  const ensaioLabel = c.ensaioData
    ? new Date(c.ensaioData + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" }) + (c.ensaioHorario ? ` às ${c.ensaioHorario}` : "")
    : "";
  return `
    <div class="culto${isPast ? " past" : ""}" id="culto-${encodeURIComponent(c.date)}">
      <div class="culto-date">${dateLabel}</div>
      <div class="culto-label">${c.label || ""}</div>
      ${ensaioLabel ? `<p style="font-size:0.82rem;background:var(--card-2);border-radius:8px;padding:7px 10px;margin:8px 0 0;">🗓️ Ensaio: <b>${ensaioLabel}</b></p>` : ""}
      <div class="role-row" style="margin-top:12px;"><span class="role-tag">Ministro</span><span class="role-val">${c.ministro || "—"}</span></div>
      <div class="role-row"><span class="role-tag">Músicos</span><span class="role-val">${(c.musicos || []).map(m => `${m.name} (${m.instrumento})`).join(", ") || "—"}</span></div>
      <div class="role-row"><span class="role-tag">Backing</span><span class="role-val">${(c.vocalBacking || []).join(", ") || "—"}</span></div>
      ${rep}
      <button class="share-culto-btn" data-date="${c.date}" style="width:100%;margin-top:12px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-size:0.82rem;font-weight:700;padding:10px;cursor:pointer;">📤 Compartilhar</button>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <a href="admin-escala.html?date=${encodeURIComponent(c.date)}&label=${encodeURIComponent(c.label || "")}" style="flex:1;text-align:center;border:1px solid var(--border);border-radius:10px;padding:8px;font-size:0.78rem;font-weight:600;color:var(--accent);text-decoration:none;">Editar</a>
        <button class="delete-culto-btn" data-date="${c.date}" data-label="${escapeAttr(c.label || "")}" style="flex:1;background:none;border:1px solid var(--border);border-radius:10px;color:#b23f3f;font-size:0.78rem;font-weight:600;padding:8px;cursor:pointer;">Excluir culto</button>
      </div>
    </div>`;
}

function wireCultoButtons(container) {
  container.querySelectorAll(".delete-culto-btn").forEach(btn => {
    btn.addEventListener("click", () => deleteCulto(btn.dataset.date, btn.dataset.label));
  });
  container.querySelectorAll(".share-culto-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const c = lastEscala.find(x => x.date === btn.dataset.date);
      if (c) shareCulto(c, lastByTitle);
    });
  });
}

function renderLists() {
  const today = todayStr();
  const sorted = [...lastEscala].sort((a, b) => a.date.localeCompare(b.date));
  const upcoming = sorted.filter(c => c.date >= today);
  const past = sorted.filter(c => c.date < today).reverse(); // mais recente primeiro

  const upcomingEl = document.getElementById("upcoming-list");
  if (sorted.length === 0) {
    upcomingEl.innerHTML = `<p class="empty">Nenhum culto na escala ainda.<br><a class="add-link" href="admin-escala.html" style="display:inline-block;margin-top:12px;">+ Adicionar o primeiro</a></p>`;
  } else if (upcoming.length === 0) {
    upcomingEl.innerHTML = `<p class="empty">Nenhum culto futuro na escala.</p>`;
  } else {
    upcomingEl.innerHTML = upcoming.map(c => cultoCardHtml(c, false)).join("");
    wireCultoButtons(upcomingEl);
  }

  const toggleBtn = document.getElementById("history-toggle-btn");
  const historyEl = document.getElementById("history-list");
  if (past.length === 0) {
    toggleBtn.style.display = "none";
    historyEl.style.display = "none";
  } else {
    toggleBtn.style.display = "block";
    toggleBtn.textContent = historyOpen ? "▲ Esconder histórico" : `▼ Ver histórico (${past.length})`;
    historyEl.innerHTML = past.map(c => cultoCardHtml(c, true)).join("");
    wireCultoButtons(historyEl);
    historyEl.style.display = historyOpen ? "flex" : "none";
  }
}

function toggleHistory() {
  historyOpen = !historyOpen;
  renderLists();
}
document.getElementById("history-toggle-btn").addEventListener("click", toggleHistory);

function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

// ── Compartilhar o culto formatado pro WhatsApp (Web Share API) ────────────
function buildCultoShareText(c, byTitle) {
  const dateLabel = new Date(c.date + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
  const lines = [];
  lines.push(`📅 *${dateLabel[0].toUpperCase()}${dateLabel.slice(1)}*`);
  if (c.label) lines.push(`*${c.label}*`);
  lines.push("");
  lines.push(`🎤 Ministro: ${c.ministro || "—"}`);
  if ((c.musicos || []).length) lines.push(`🎸 Músicos: ${c.musicos.map(m => `${m.name} (${m.instrumento})`).join(", ")}`);
  if ((c.vocalBacking || []).length) lines.push(`🎶 Backing: ${c.vocalBacking.join(", ")}`);
  if (c.ensaioData) {
    const ensaioLabel = new Date(c.ensaioData + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" }) + (c.ensaioHorario ? ` às ${c.ensaioHorario}` : "");
    lines.push("");
    lines.push(`🗓️ Ensaio: ${ensaioLabel}`);
  }
  if ((c.repertorio || []).length) {
    lines.push("");
    lines.push("*Repertório:*");
    let songNum = 0;
    c.repertorio.forEach(item => {
      if (item.type === "header") {
        songNum = 0;
        lines.push(`_${item.text}_`);
        return;
      }
      songNum++;
      const song = byTitle[item.text];
      const tone = song ? (song.presets?.[c.ministro] || song.originalKey || "") : "";
      lines.push(`${songNum}. ${item.text}${tone ? " (" + tone + ")" : ""}`);
    });
  }
  lines.push("");
  lines.push(`🔗 Cifras do repertório: ${location.origin}${location.pathname.replace(/[^/]*$/, "")}escala.html#culto-${encodeURIComponent(c.date)}`);
  lines.push("");
  lines.push("_Ministério de Louvor — IP Arthur Lundgren I_");
  return lines.join("\n");
}

async function shareCulto(c, byTitle) {
  const text = buildCultoShareText(c, byTitle);
  if (navigator.share) {
    try {
      await navigator.share({ text });
    } catch (e) {
      // usuário cancelou o menu de compartilhar — não é erro de verdade
    }
  } else {
    try {
      await navigator.clipboard.writeText(text);
      alert("Copiado! Cola direto na conversa do WhatsApp.");
    } catch (e) {
      alert("Não consegui copiar automaticamente. Texto:\n\n" + text);
    }
  }
}

async function deleteCulto(date, label) {
  if (!confirm("Excluir este culto da escala? Não tem como desfazer.")) return;
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "deleteEscala", date, label }),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "falha ao excluir");
    load();
  } catch (e) {
    alert("Não deu pra excluir agora (" + e.message + "). Tenta de novo.");
  }
}
</script>
</body>
</html>
