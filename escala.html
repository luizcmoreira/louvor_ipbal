<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Escala — Ministério de Louvor</title>
<style>
  :root {
    --bg: #f5f7f4; --card: #ffffff; --card-2: #eef2ec; --text: #1c2620; --muted: #5c665f;
    --accent: #1e6b3f; --accent-on: #ffffff; --border: #dde3da;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); padding-bottom:40px; }
  header { padding:14px 16px 12px; border-bottom:1px solid var(--border); display:flex; flex-direction:column; gap:6px; }
  .home-link { display:inline-flex; align-items:center; gap:4px; color:var(--accent); text-decoration:none; font-size:0.82rem; font-weight:700; }
  .header-row { display:flex; align-items:center; justify-content:space-between; }
  h1 { font-size:1.05rem; margin:0; }
  .add-link { font-size:0.82rem; font-weight:700; color:var(--accent); text-decoration:none; border:1px solid var(--border); padding:6px 12px; border-radius:20px; }
  main { padding:16px; display:flex; flex-direction:column; gap:14px; max-width:520px; margin:0 auto; }
  .culto {
    background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px;
    box-shadow:0 1px 3px rgba(20,30,20,0.05);
  }
  .culto-date { font-size:0.78rem; font-weight:700; color:var(--accent); text-transform:capitalize; }
  .culto-label { font-size:1.02rem; font-weight:700; margin:2px 0 12px; }
  .role-row { display:flex; gap:8px; margin-bottom:6px; font-size:0.85rem; }
  .role-tag { font-weight:700; color:var(--muted); flex-shrink:0; width:78px; }
  .role-val { color:var(--text); }
  .rep-list { margin-top:10px; padding-top:10px; border-top:1px solid var(--border); display:flex; flex-wrap:wrap; gap:6px; }
  .rep-pill {
    font-size:0.8rem; font-weight:600; color:var(--accent); background:rgba(30,107,63,0.08);
    border-radius:20px; padding:5px 12px; text-decoration:none;
  }
  .empty { text-align:center; color:var(--muted); font-size:0.9rem; padding:40px 20px; }

  .obs-wrap { margin-top:8px; }
  .obs-view {
    font-size:0.82rem; background:rgba(196,138,23,0.10); border-radius:8px; padding:7px 10px; margin:0;
    display:flex; align-items:baseline; gap:6px; line-height:1.4;
  }
  .obs-edit-icon { margin-left:auto; cursor:pointer; flex-shrink:0; background:none; border:none; font-size:0.85rem; padding:0; }
  .obs-add-btn {
    font-size:0.78rem; font-weight:600; color:var(--muted); background:var(--card-2);
    border:1px dashed var(--border); border-radius:8px; padding:7px 10px; cursor:pointer; width:100%; text-align:left;
  }
</style>
</head>
<script src="config.js"></script>
<body>

<header>
  <a class="home-link" href="index.html">← Início</a>
  <div class="header-row">
    <h1>Escala</h1>
    <a class="add-link" href="admin-escala.html">+ Novo culto</a>
  </div>
</header>

<main id="main"></main>

<script>
async function load() {
  const main = document.getElementById("main");
  let escala, songs;
  try {
    [escala, songs] = await Promise.all([
      fetch(API_URL + "?sheet=Escala", { cache: "no-store" }).then(r => r.json()),
      fetch(API_URL + "?sheet=Musicas", { cache: "no-store" }).then(r => r.json()),
    ]);
  } catch (e) {
    main.innerHTML = "<p style='color:#b23f3f'>Não consegui carregar a escala.</p>";
    return;
  }

  if (escala.length === 0) {
    main.innerHTML = `<p class="empty">Nenhum culto na escala ainda.<br><a class="add-link" href="admin-escala.html" style="display:inline-block;margin-top:12px;">+ Adicionar o primeiro</a></p>`;
    return;
  }

  const byTitle = Object.fromEntries(songs.map(s => [s.title, s]));
  const sorted = [...escala].sort((a, b) => a.date.localeCompare(b.date));

  main.innerHTML = sorted.map(c => {
    const dateLabel = new Date(c.date + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
    const rep = (c.repertorio || []).map(title => {
      const song = byTitle[title];
      const tone = song ? (song.presets?.[c.ministro] || song.originalKey || "") : "";
      const href = `cifras.html?song=${encodeURIComponent(title)}&singer=${encodeURIComponent(c.ministro || "")}`;
      return `<a class="rep-pill" href="${href}">${title}${tone ? " · " + tone : ""}</a>`;
    }).join("");
    const ensaioLabel = c.ensaioData
      ? new Date(c.ensaioData + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" }) + (c.ensaioHorario ? ` às ${c.ensaioHorario}` : "")
      : "";
    return `
      <div class="culto" id="culto-${encodeURIComponent(c.date)}">
        <div class="culto-date">${dateLabel}</div>
        <div class="culto-label">${c.label || ""}</div>
        ${ensaioLabel ? `<p style="font-size:0.82rem;background:var(--card-2);border-radius:8px;padding:7px 10px;margin:8px 0 0;">🗓️ Ensaio: <b>${ensaioLabel}</b></p>` : ""}
        <div class="role-row" style="margin-top:12px;"><span class="role-tag">Ministro</span><span class="role-val">${c.ministro || "—"}</span></div>
        <div class="role-row"><span class="role-tag">Músicos</span><span class="role-val">${(c.musicos || []).map(m => `${m.name} (${m.instrumento})`).join(", ") || "—"}</span></div>
        <div class="role-row"><span class="role-tag">Backing</span><span class="role-val">${(c.vocalBacking || []).join(", ") || "—"}</span></div>
        ${obsBlock(c, "obsAntes", "Antes do ensaio")}
        ${obsBlock(c, "obsDepois", "Depois do ensaio")}
        ${rep ? `<div class="rep-list">${rep}</div>` : ""}
        <div style="display:flex;gap:8px;margin-top:12px;">
          <a href="admin-escala.html?date=${encodeURIComponent(c.date)}&label=${encodeURIComponent(c.label || "")}" style="flex:1;text-align:center;border:1px solid var(--border);border-radius:10px;padding:8px;font-size:0.78rem;font-weight:600;color:var(--accent);text-decoration:none;">Editar</a>
          <button class="delete-culto-btn" data-date="${c.date}" data-label="${escapeAttr(c.label || "")}" style="flex:1;background:none;border:1px solid var(--border);border-radius:10px;color:#b23f3f;font-size:0.78rem;font-weight:600;padding:8px;cursor:pointer;">Excluir culto</button>
        </div>
      </div>`;
  }).join("");

  main.querySelectorAll(".delete-culto-btn").forEach(btn => {
    btn.addEventListener("click", () => deleteCulto(btn.dataset.date, btn.dataset.label));
  });
}
load();

function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

// ── Observação antes/depois do ensaio — editável direto no card ────────────
function obsBlock(c, field, labelText) {
  const val = c[field] || "";
  return `<div class="obs-wrap" data-date="${c.date}" data-label="${escapeAttr(c.label || "")}" data-field="${field}" data-label-text="${labelText}" data-value="${escapeAttr(val)}">
    ${val
      ? `<p class="obs-view"><span><b>${labelText}:</b> ${val}</span><button type="button" class="obs-edit-icon" title="Editar">✏️</button></p>`
      : `<button type="button" class="obs-add-btn">+ ${labelText}</button>`}
  </div>`;
}

document.addEventListener("click", (ev) => {
  const trigger = ev.target.closest(".obs-add-btn, .obs-edit-icon");
  if (!trigger) return;
  openObsEditor(trigger.closest(".obs-wrap"));
});

function openObsEditor(wrap) {
  const { date, label, field, labelText, value } = wrap.dataset;
  wrap.innerHTML = `
    <label style="font-size:0.76rem;font-weight:700;color:var(--muted);display:block;margin-bottom:4px;">${labelText}</label>
    <textarea class="obs-textarea" style="width:100%;min-height:70px;border-radius:8px;border:1px solid var(--border);padding:8px;font-family:inherit;font-size:0.85rem;box-sizing:border-box;">${value}</textarea>
    <div style="display:flex;gap:8px;margin-top:6px;">
      <button type="button" class="obs-cancel-btn" style="flex:1;padding:7px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:0.78rem;font-weight:600;cursor:pointer;">Cancelar</button>
      <button type="button" class="obs-save-btn" style="flex:1;padding:7px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:0.78rem;font-weight:700;cursor:pointer;">Salvar</button>
    </div>`;
  wrap.querySelector(".obs-textarea").focus();
  wrap.querySelector(".obs-cancel-btn").addEventListener("click", () => load());
  wrap.querySelector(".obs-save-btn").addEventListener("click", () => saveObs(wrap, date, label, field));
}

async function saveObs(wrap, date, label, field) {
  const value = wrap.querySelector(".obs-textarea").value;
  const btn = wrap.querySelector(".obs-save-btn");
  btn.disabled = true; btn.textContent = "Salvando…";
  const payload = { action: "updateEscala", matchDate: date, matchLabel: label, date, label };
  payload[field] = value;
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "falha ao salvar");
    load();
  } catch (e) {
    alert("Não deu pra salvar: " + e.message);
    btn.disabled = false; btn.textContent = "Salvar";
  }
}

async function deleteCulto(date, label) {
  if (!confirm("Excluir este culto da escala? Não tem como desfazer.")) return;
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "deleteEscala", date, label }),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "falha ao excluir");
    load();
  } catch (e) {
    alert("Não deu pra excluir agora (" + e.message + "). Tenta de novo.");
  }
}
</script>
</body>
</html>
