<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ensaios — Ministério de Louvor</title>
<style>
  :root {
    --bg: #f5f7f4; --card: #ffffff; --card-2: #eef2ec; --text: #1c2620; --muted: #5c665f;
    --accent: #1e6b3f; --accent-on: #ffffff; --border: #dde3da;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); padding-bottom:40px; }
  header { padding:14px 16px 12px; border-bottom:1px solid var(--border); }
  .home-link { display:inline-flex; align-items:center; gap:4px; color:var(--accent); text-decoration:none; font-size:0.82rem; font-weight:700; margin-bottom:10px; }
  h1 { font-size:1.05rem; margin:0; }
  main { padding:16px; display:flex; flex-direction:column; gap:16px; max-width:520px; margin:0 auto; }
  .culto {
    background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px;
    box-shadow:0 1px 3px rgba(20,30,20,0.05);
  }
  .culto-date { font-size:0.78rem; font-weight:700; color:var(--accent); text-transform:capitalize; }
  .culto-label { font-size:1.08rem; font-weight:700; margin:2px 0; }
  .culto-top { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:14px; }
  .escala-link { font-size:0.74rem; font-weight:700; color:var(--accent); text-decoration:none; white-space:nowrap; flex-shrink:0; }
  .ensaio-info { font-size:0.82rem; color:var(--text); background:var(--card-2); border-radius:8px; padding:8px 10px; margin:0 0 12px; }
  .obs-wrap { margin-top:12px; }
  .obs-view {
    font-size:0.82rem; background:rgba(196,138,23,0.10); border-radius:8px; padding:8px 10px; margin:0;
    display:flex; align-items:baseline; gap:6px; line-height:1.4;
  }
  .obs-edit-icon { margin-left:auto; cursor:pointer; flex-shrink:0; background:none; border:none; font-size:0.85rem; padding:0; }
  .obs-add-btn {
    font-size:0.78rem; font-weight:600; color:var(--muted); background:var(--card-2);
    border:1px dashed var(--border); border-radius:8px; padding:8px 10px; cursor:pointer; width:100%; text-align:left;
  }

  .rep-title { font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); margin-bottom:8px; }
  .rep-item {
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; border:1px solid var(--border); border-radius:12px; margin-bottom:8px;
    text-decoration:none; color:var(--text);
  }
  .rep-item-title { font-weight:600; font-size:0.95rem; }
  .rep-item-tone { font-size:0.85rem; font-weight:700; color:var(--accent); flex-shrink:0; }
  .empty { text-align:center; color:var(--muted); font-size:0.9rem; padding:40px 20px; }
</style>
</head>
<script src="config.js"></script>
<body>

<header style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
  <div>
    <a class="home-link" href="index.html">← Início</a>
    <h1>Ensaios — próximos cultos</h1>
  </div>
  <a href="escala.html" style="font-size:0.8rem;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--border);padding:7px 12px;border-radius:20px;white-space:nowrap;">Ver escala →</a>
</header>

<main id="main"></main>

<script>
async function load() {
  const main = document.getElementById("main");
  let escala, songs;
  try {
    [escala, songs] = await Promise.all([
      fetch(API_URL + "?sheet=Escala", { cache: "no-store" }).then(r => r.json()),
      fetch(API_URL + "?sheet=Musicas", { cache: "no-store" }).then(r => r.json()),
    ]);
  } catch (e) {
    main.innerHTML = "<p style='color:#b23f3f'>Não consegui carregar os ensaios.</p>";
    return;
  }

  const todayStr = new Date().toISOString().slice(0, 10);
  const upcoming = escala.filter(c => c.date >= todayStr).sort((a, b) => a.date.localeCompare(b.date));

  if (upcoming.length === 0) {
    main.innerHTML = `<p class="empty">Nenhum culto futuro na escala.<br>Cadastre em <a href="admin-escala.html">Escala</a>.</p>`;
    return;
  }

  const byTitle = Object.fromEntries(songs.map(s => [s.title, s]));

  main.innerHTML = upcoming.map(c => {
    const dateLabel = new Date(c.date + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });

    const rep = (c.repertorio || []).map(title => {
      const song = byTitle[title];
      const tone = song ? (song.presets?.[c.ministro] || song.originalKey || "?") : "?";
      const href = `cifras.html?song=${encodeURIComponent(title)}&singer=${encodeURIComponent(c.ministro || "")}`;
      return `<a class="rep-item" href="${href}"><span class="rep-item-title">${title}</span><span class="rep-item-tone">${tone}</span></a>`;
    }).join("");

    const ensaioLabel = c.ensaioData
      ? new Date(c.ensaioData + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" }) + (c.ensaioHorario ? ` às ${c.ensaioHorario}` : "")
      : "";

    return `
      <div class="culto">
        <div class="culto-top">
          <div>
            <div class="culto-date">${dateLabel}</div>
            <div class="culto-label">${c.label || ""}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;">
            <a class="escala-link" href="escala.html#culto-${encodeURIComponent(c.date)}">Ver escala →</a>
            <a class="escala-link" href="admin-escala.html?date=${encodeURIComponent(c.date)}&label=${encodeURIComponent(c.label || "")}">✏️ Editar</a>
          </div>
        </div>
        ${ensaioLabel ? `<p class="ensaio-info">🗓️ Ensaio: <b>${ensaioLabel}</b></p>` : ""}
        ${obsBlock(c, "obsAntes", "Antes do ensaio")}
        ${rep ? `<div class="rep-title" style="margin-top:12px;">Repertório</div>${rep}` : `<p style="color:var(--muted);font-size:0.85rem;margin-top:12px;">Repertório ainda não definido.</p>`}
        ${obsBlock(c, "obsDepois", "Depois do ensaio")}
        <button class="share-culto-btn" data-date="${c.date}" style="width:100%;margin-top:14px;background:var(--accent);border:none;border-radius:10px;color:#fff;font-size:0.82rem;font-weight:700;padding:10px;cursor:pointer;">📤 Compartilhar</button>
      </div>`;
  }).join("");

  main.querySelectorAll(".share-culto-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const c = upcoming.find(x => x.date === btn.dataset.date);
      if (c) shareCulto(c, byTitle);
    });
  });
}
load();

// ── Compartilhar o culto formatado pro WhatsApp (Web Share API) ────────────
function buildCultoShareText(c, byTitle) {
  const dateLabel = new Date(c.date + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" });
  const lines = [];
  lines.push(`📅 *${dateLabel[0].toUpperCase()}${dateLabel.slice(1)}*`);
  if (c.label) lines.push(`*${c.label}*`);
  lines.push("");
  lines.push(`🎤 Ministro: ${c.ministro || "—"}`);
  if ((c.musicos || []).length) lines.push(`🎸 Músicos: ${c.musicos.map(m => `${m.name} (${m.instrumento})`).join(", ")}`);
  if ((c.vocalBacking || []).length) lines.push(`🎶 Backing: ${c.vocalBacking.join(", ")}`);
  if (c.ensaioData) {
    const ensaioLabel = new Date(c.ensaioData + "T12:00:00").toLocaleDateString("pt-BR", { weekday: "long", day: "numeric", month: "long" }) + (c.ensaioHorario ? ` às ${c.ensaioHorario}` : "");
    lines.push("");
    lines.push(`🗓️ Ensaio: ${ensaioLabel}`);
  }
  if (c.obsAntes) { lines.push(""); lines.push(`_Antes do ensaio:_ ${c.obsAntes}`); }
  if ((c.repertorio || []).length) {
    lines.push("");
    lines.push("*Repertório:*");
    c.repertorio.forEach((title, i) => {
      const song = byTitle[title];
      const tone = song ? (song.presets?.[c.ministro] || song.originalKey || "") : "";
      lines.push(`${i + 1}. ${title}${tone ? " (" + tone + ")" : ""}`);
    });
  }
  if (c.obsDepois) { lines.push(""); lines.push(`_Depois do ensaio:_ ${c.obsDepois}`); }
  lines.push("");
  lines.push(`🔗 Cifras do repertório: ${location.origin}${location.pathname.replace(/[^/]*$/, "")}escala.html#culto-${encodeURIComponent(c.date)}`);
  lines.push("");
  lines.push("_Ministério de Louvor — IP Arthur Lundgren I_");
  return lines.join("\n");
}

async function shareCulto(c, byTitle) {
  const text = buildCultoShareText(c, byTitle);
  if (navigator.share) {
    try {
      await navigator.share({ text });
    } catch (e) {
      // usuário cancelou o menu de compartilhar — não é erro de verdade
    }
  } else {
    try {
      await navigator.clipboard.writeText(text);
      alert("Copiado! Cola direto na conversa do WhatsApp.");
    } catch (e) {
      alert("Não consegui copiar automaticamente. Texto:\n\n" + text);
    }
  }
}

function escapeAttr(s) {
  return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;");
}

// ── Observação antes/depois do ensaio — editável direto no card ────────────
function obsBlock(c, field, labelText) {
  const val = c[field] || "";
  return `<div class="obs-wrap" data-date="${c.date}" data-label="${escapeAttr(c.label || "")}" data-field="${field}" data-label-text="${labelText}" data-value="${escapeAttr(val)}">
    ${val
      ? `<p class="obs-view"><span><b>${labelText}:</b> ${val}</span><button type="button" class="obs-edit-icon" title="Editar">✏️</button></p>`
      : `<button type="button" class="obs-add-btn">+ ${labelText}</button>`}
  </div>`;
}

document.addEventListener("click", (ev) => {
  const trigger = ev.target.closest(".obs-add-btn, .obs-edit-icon");
  if (!trigger) return;
  openObsEditor(trigger.closest(".obs-wrap"));
});

function openObsEditor(wrap) {
  const { date, label, field, labelText, value } = wrap.dataset;
  wrap.innerHTML = `
    <label style="font-size:0.76rem;font-weight:700;color:var(--muted);display:block;margin-bottom:4px;">${labelText}</label>
    <textarea class="obs-textarea" style="width:100%;min-height:70px;border-radius:8px;border:1px solid var(--border);padding:8px;font-family:inherit;font-size:0.85rem;box-sizing:border-box;">${value}</textarea>
    <div style="display:flex;gap:8px;margin-top:6px;">
      <button type="button" class="obs-cancel-btn" style="flex:1;padding:7px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-size:0.78rem;font-weight:600;cursor:pointer;">Cancelar</button>
      <button type="button" class="obs-save-btn" style="flex:1;padding:7px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-size:0.78rem;font-weight:700;cursor:pointer;">Salvar</button>
    </div>`;
  wrap.querySelector(".obs-textarea").focus();
  wrap.querySelector(".obs-cancel-btn").addEventListener("click", () => load());
  wrap.querySelector(".obs-save-btn").addEventListener("click", () => saveObs(wrap, date, label, field));
}

async function saveObs(wrap, date, label, field) {
  const value = wrap.querySelector(".obs-textarea").value;
  const btn = wrap.querySelector(".obs-save-btn");
  btn.disabled = true; btn.textContent = "Salvando…";
  const payload = { action: "updateEscala", matchDate: date, matchLabel: label, date, label };
  payload[field] = value;
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "falha ao salvar");
    load();
  } catch (e) {
    alert("Não deu pra salvar: " + e.message);
    btn.disabled = false; btn.textContent = "Salvar";
  }
}
</script>
</body>
</html>
