<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Gerador de música (uso pessoal)</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; background:#f5f7f4; color:#1c2620; padding:16px; max-width:640px; margin:0 auto; }
  .home-link { display:inline-flex; align-items:center; gap:4px; color:#1e6b3f; text-decoration:none; font-size:0.82rem; font-weight:700; }
  h1 { font-size:1.1rem; margin-top:14px; }
  label { display:block; margin-top:14px; font-size:0.85rem; color:#5c665f; }
  input, textarea, select { width:100%; padding:9px; border-radius:8px; border:1px solid #dde3da; background:#ffffff; color:#1c2620; font-size:0.95rem; box-sizing:border-box; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:#1e6b3f; box-shadow:0 0 0 3px rgba(30,107,63,0.15); }
  textarea { min-height:140px; font-family: ui-monospace, monospace; }
  .row3 { display:flex; gap:8px; flex-wrap:wrap; }
  .row3 > div { flex:1 1 140px; }
  @media (max-width: 420px) {
    body { padding:14px; }
  }
  button { margin-top:16px; padding:12px 18px; border-radius:8px; border:none; background:#1e6b3f; color:#ffffff; font-weight:700; font-size:1rem; cursor:pointer; width:100%; }
  .hint { font-size:0.78rem; color:#5c665f; margin-top:6px; }

  .cifra-editor { display:flex; gap:10px; margin-top:8px; align-items:stretch; }
  .tag-col { display:flex; flex-direction:column; gap:6px; flex:0 0 116px; }
  .tag-btn {
    width:100%; margin-top:0; text-align:left;
    font-size:0.78rem; font-weight:600; color:#1c2620; background:#eef2ec;
    border:1px solid #dde3da; border-radius:8px; padding:8px 10px; cursor:pointer;
  }
  .tag-btn:active { background:#1e6b3f; color:#fff; }
  #chordpro { flex:1; min-height:380px; margin-top:0; }
  @media (max-width: 560px) {
    .cifra-editor { flex-direction:column; }
    .tag-col { flex-direction:row; flex-wrap:wrap; flex-basis:auto; }
    .tag-btn { width:auto; flex:0 0 auto; }
    #chordpro { min-height:260px; }
  }
</style>
</head>
<script src="config.js"></script>
<body>
<a class="home-link" href="cifras.html">← Cifras</a>
<h1 id="page-title">Cadastrar música</h1>

<label>Título</label>
<input id="title" placeholder="Ex: Te agradeço">

<label>Tom original</label>
<input id="key" placeholder="Ex: G, Am, D">

<div class="row3">
  <div><label>Tom — Ricardo</label><input id="s1t" placeholder="Ex: G"></div>
  <div><label>Tom — Kariny</label><input id="s2t" placeholder="Ex: G"></div>
  <div><label>Tom — Luiz</label><input id="s3t" placeholder="Ex: C"></div>
</div>

<label>Vídeo — versão completa (YouTube)</label>
<input id="videoCompleta" placeholder="https://...">

<label>Vídeo — versão congregacional (YouTube)</label>
<input id="videoCongregacional" placeholder="https://...">

<label><input type="checkbox" id="isNew" style="width:auto;display:inline"> É música nova (categoria "Novas")</label>

<label>Cifra (formato ChordPro — acorde colado antes da palavra, entre colchetes)</label>
<div class="cifra-editor">
  <div class="tag-col">
    <button type="button" class="tag-btn" data-tag="[Intro]">Intro</button>
    <button type="button" class="tag-btn" data-tag="[Solo]">Solo</button>
    <button type="button" class="tag-btn" data-tag="[Break]">Break</button>
    <button type="button" class="tag-btn" data-tag="[Repete 2x]">Repetir 2x</button>
    <button type="button" class="tag-btn" data-tag="[Repete 3x]">Repetir 3x</button>
    <button type="button" class="tag-btn" data-tag="[Repete 4x]">Repetir 4x</button>
    <button type="button" class="tag-btn" data-tag="[Repete 8x]">Repetir 8x</button>
    <button type="button" class="tag-btn" data-tag="[Volta do início]">Voltar do início</button>
  </div>
  <textarea id="chordpro" placeholder="[G]Te agradeço [D]Senhor
[Em]Por tudo o [C]que fizeste"></textarea>
</div>

<button onclick="salvar()" id="save-btn">Salvar música</button>
<button onclick="excluir()" id="delete-btn" style="display:none;background:none;color:#b23f3f;font-weight:600;margin-top:10px;">Excluir música</button>
<p id="msg" style="text-align:center;font-size:0.85rem;margin-top:10px;"></p>

<script>
// Modo edição: chegando com ?title=X, pré-preenche tudo com o que já está
// salvo e troca "Cadastrar" (addMusica) por "Salvar alterações" (updateMusica).
const editingTitle = new URLSearchParams(location.search).get("title");

async function initEdit() {
  if (!editingTitle) return;
  document.getElementById("page-title").textContent = "Editar música";
  document.getElementById("save-btn").textContent = "Salvar alterações";
  document.getElementById("delete-btn").style.display = "block";
  try {
    const res = await fetch(API_URL + "?sheet=Musicas", { cache: "no-store" });
    const songs = await res.json();
    const song = songs.find(s => s.title === editingTitle);
    if (!song) { document.getElementById("msg").textContent = "Música não encontrada."; return; }
    document.getElementById("title").value = song.title;
    document.getElementById("key").value = song.originalKey || "";
    document.getElementById("s1t").value = song.presets?.Ricardo || "";
    document.getElementById("s2t").value = song.presets?.Kariny || "";
    document.getElementById("s3t").value = song.presets?.Luiz || "";
    document.getElementById("chordpro").value = song.chordpro || "";
    document.getElementById("isNew").checked = !!song.isNew;
    document.getElementById("videoCompleta").value = song.videoCompleta || "";
    document.getElementById("videoCongregacional").value = song.videoCongregacional || "";
  } catch (e) {
    document.getElementById("msg").textContent = "Não consegui carregar a música pra editar.";
  }
}
initEdit();

document.querySelectorAll(".tag-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const ta = document.getElementById("chordpro");
    const tag = btn.dataset.tag;
    const start = ta.selectionStart, end = ta.selectionEnd;
    const before = ta.value.slice(0, start), after = ta.value.slice(end);
    const needsNewlineBefore = before.length > 0 && !before.endsWith("\n");
    const insert = (needsNewlineBefore ? "\n" : "") + tag + "\n";
    ta.value = before + insert + after;
    const pos = (before + insert).length;
    ta.focus();
    ta.setSelectionRange(pos, pos);
  });
});

async function excluir() {
  if (!editingTitle) return;
  if (!confirm(`Excluir "${editingTitle}"? Isso apaga a linha na planilha, não tem como desfazer.`)) return;
  const btn = document.getElementById('delete-btn');
  const msg = document.getElementById('msg');
  btn.disabled = true; btn.textContent = "Excluindo…";
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "deleteMusica", title: editingTitle }),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "falha ao excluir");
    location.href = "cifras.html";
  } catch (e) {
    msg.style.color = "#b23f3f";
    msg.textContent = "Não deu pra excluir: " + e.message;
    btn.disabled = false; btn.textContent = "Excluir música";
  }
}

async function salvar() {
  const title = document.getElementById('title').value.trim();
  if (!title) { alert("Preenche o título."); return; }
  const payload = {
    action: editingTitle ? "updateMusica" : "addMusica",
    matchTitle: editingTitle,
    title,
    originalKey: document.getElementById('key').value,
    tom_Ricardo: document.getElementById('s1t').value.trim(),
    tom_Kariny: document.getElementById('s2t').value.trim(),
    tom_Luiz: document.getElementById('s3t').value.trim(),
    chordpro: document.getElementById('chordpro').value,
    isNew: document.getElementById('isNew').checked,
    videoCompleta: document.getElementById('videoCompleta').value,
    videoCongregacional: document.getElementById('videoCongregacional').value,
  };
  const btn = document.getElementById('save-btn');
  const msg = document.getElementById('msg');
  btn.disabled = true; btn.textContent = "Salvando…";
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "falha ao salvar");
    msg.style.color = "#1e6b3f";
    msg.textContent = "Música salva!";
    setTimeout(() => location.href = "cifras.html", 900);
  } catch (e) {
    msg.style.color = "#b23f3f";
    msg.textContent = "Não deu pra salvar: " + e.message;
    btn.disabled = false; btn.textContent = editingTitle ? "Salvar alterações" : "Salvar música";
  }
}

// ── Conversor "acorde em cima da letra" → ChordPro inline ──────────────────
const CHORD_RE = /^[A-G](#|b)?(m7b5|m7|m9|m6|m|maj7|maj9|maj|min7|min9|min|dim7|dim|aug|sus4|sus2|sus|add9|add2|add|6|7|9|11|13)?(\/[A-G](#|b)?)?$/;

function isChordToken(tok) { return CHORD_RE.test(tok); }

function isChordLine(line) {
  const trimmed = line.trim();
  if (!trimmed) return false;
  const tokens = trimmed.split(/\s+/);
  const hits = tokens.filter(isChordToken).length;
  return hits / tokens.length >= 0.6;
}

function mergeChordIntoLyric(chordLine, lyricLine) {
  const matches = [];
  const re = /\S+/g;
  let m;
  while ((m = re.exec(chordLine)) !== null) matches.push({ text: m[0], col: m.index });
  let result = lyricLine;
  for (let i = matches.length - 1; i >= 0; i--) {
    const insertAt = Math.min(matches[i].col, result.length);
    result = result.slice(0, insertAt) + `[${matches[i].text}]` + result.slice(insertAt);
  }
  return result;
}

// Limpa lixo de HTML que às vezes vem junto quando se copia texto de uma
// página já renderizada (tags inteiras, ou só o resto de uma tag cortada
// tipo `">G`, sobra de `<span class="chord">G</span>`).
function sanitizeRaw(text) {
  return text
    .replace(/<[^>]*>/g, "")
    .replace(/"\s*>/g, "")
    .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
    .replace(/&quot;/g, '"').replace(/&#39;/g, "'");
}

function looksAlreadyBracketed(text) {
  return (text.match(/\[[^\]]{1,12}\]/g) || []).length >= 2;
}

function stripChords(line) {
  return line.replace(/\[[^\]]+\]/g, "").trim();
}

// Alguns sites (Cifra Club incluso) colam a mesma linha duas vezes — uma
// com o acorde marcado, outra "limpa" — por causa de como a página é
// montada (versão com/sem cifra no mesmo bloco de texto). Detecta quando
// duas linhas seguidas são a mesma letra (ignorando os acordes) e mantém
// só uma — de preferência a que tiver o acorde.
function dedupeChordLines(lines) {
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const next = lines[i + 1];
    if (next !== undefined) {
      const a = stripChords(line);
      const b = stripChords(next);
      if (a && a === b) {
        out.push(/\[[^\]]+\]/.test(line) ? line : next);
        i++;
        continue;
      }
    }
    out.push(line);
  }
  return out;
}

function convertCifraText(raw) {
  const lines = raw.replace(/\r\n/g, "\n").split("\n");
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (isChordLine(line)) {
      const next = lines[i + 1];
      if (next !== undefined && next.trim() !== "" && !isChordLine(next)) {
        out.push(mergeChordIntoLyric(line, next));
        i++;
      } else {
        out.push(line.trim().split(/\s+/).map(c => `[${c}]`).join(" "));
      }
    } else {
      out.push(line);
    }
  }
  return dedupeChordLines(out).join("\n");
}

document.getElementById("chordpro").addEventListener("paste", function (e) {
  const raw = (e.clipboardData || window.clipboardData).getData("text");
  if (!raw) return;
  e.preventDefault();
  const cleaned = sanitizeRaw(raw);
  const finalText = looksAlreadyBracketed(cleaned) ? cleaned : convertCifraText(cleaned);
  const ta = this;
  const start = ta.selectionStart, end = ta.selectionEnd;
  ta.value = ta.value.slice(0, start) + finalText + ta.value.slice(end);
  const pos = start + finalText.length;
  ta.setSelectionRange(pos, pos);
});
</script>
</body>
</html>
