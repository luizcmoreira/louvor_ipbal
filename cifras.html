<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cifras - Ministério de Louvor IP Arthur Lundgren I</title>
<style>
  :root {
    /* Verde e Cinza são as cores institucionais da IPB (Pantone 350C e Cool
       Gray/Black C no manual de identidade visual). */
    --bg: #f5f7f4;
    --card: #ffffff;
    --card-2: #eef2ec;
    --text: #1c2620;
    --muted: #5c665f;
    --accent: #1e6b3f;       /* verde IPB */
    --accent-2: #6b7a70;     /* cinza institucional */
    --accent-on: #ffffff;
    --border: #dde3da;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding-bottom: 60px;
  }
  header {
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 10;
  }
  .home-link {
    display: inline-flex; align-items: center; gap: 4px;
    color: var(--accent); text-decoration: none; font-size: 0.82rem; font-weight: 700;
    margin-bottom: 10px;
  }
  .header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  .logo { width: 38px; height: 38px; object-fit: contain; flex-shrink: 0; }
  header h1 { font-size: 1.0rem; margin: 0; line-height: 1.3; color: var(--text); }
  #search {
    width: 100%;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 1rem;
    outline: none;
    box-shadow: 0 1px 2px rgba(20,30,20,0.04);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(30,107,63,0.15); }

  .filter-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .filter-btn {
    padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border);
    background: var(--card); color: var(--muted); font-size: 0.85rem; cursor: pointer;
    transition: all .15s ease;
  }
  .filter-btn:active { transform: scale(0.96); }
  .filter-btn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-on); font-weight: 600; box-shadow: 0 2px 8px rgba(30,107,63,0.25); }
  #song-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
  .song-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 12px 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    box-shadow: 0 1px 3px rgba(20,30,20,0.05);
    transition: transform .12s ease;
  }
  .song-item-info { flex: 1; min-width: 0; cursor: pointer; }
  .song-item-info:active { opacity: 0.7; }
  .song-item-title { font-size: 1.02rem; margin-bottom: 3px; font-weight: 600; overflow-wrap: break-word; }
  .song-item .tag { color: var(--muted); font-size: 0.85rem; }
  .song-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex-shrink: 0; }
  @media (max-width: 480px) {
    .song-item { flex-direction: column; align-items: stretch; }
    .song-actions { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: flex-end; }
  }
  .yt-icon {
    flex-shrink: 0;
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--card-2);
    color: var(--accent);
    font-size: 1rem;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s ease;
  }
  .yt-icon:active { background: var(--accent); color: var(--accent-on); transform: scale(0.92); }

  #view { display: none; padding: 12px 16px 40px; }
  #view.active { display: block; }
  .back-btn {
    background: none; border: none; color: var(--accent);
    font-size: 1rem; padding: 6px 0 14px; cursor: pointer; font-weight: 600;
  }
  .song-title { font-size: 1.3rem; margin: 0 0 4px; color: var(--text); }
  .song-meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 14px; }

  .singer-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .singer-btn {
    flex: 1 1 auto;
    padding: 11px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    font-size: 0.95rem;
    cursor: pointer;
    transition: all .15s ease;
  }
  .singer-btn:active { transform: scale(0.96); }
  .singer-btn.active { background: var(--accent); color: var(--accent-on); border-color: var(--accent); font-weight: 600; box-shadow: 0 2px 8px rgba(30,107,63,0.25); }

  .tone-control {
    display: flex; align-items: center; justify-content: center; gap: 18px;
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 12px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(20,30,20,0.05);
  }
  .tone-control button {
    width: 46px; height: 46px; border-radius: 50%;
    border: 1px solid var(--border); background: var(--card-2); color: var(--text);
    font-size: 1.3rem; cursor: pointer; transition: all .15s ease;
  }
  .tone-control button:active { transform: scale(0.9); background: var(--accent); color: var(--accent-on); }
  .tone-display { font-size: 1.4rem; font-weight: 700; color: var(--accent); min-width: 60px; text-align: center; }

  .links-row { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
  .links-row a {
    color: var(--accent); text-decoration: none; font-size: 0.9rem; font-weight: 600;
    border: 1px solid var(--border); padding: 9px 14px; border-radius: 10px;
    transition: all .15s ease;
  }
  .links-row a:active { background: var(--accent); color: var(--accent-on); }
  .tag-btn {
    font-size: 0.78rem; font-weight: 600; color: var(--text); background: var(--card-2);
    border: 1px solid var(--border); border-radius: 20px; padding: 6px 12px; cursor: pointer;
  }
  .tag-btn:active { background: var(--accent); color: var(--accent-on); }
  .hint { font-size: 0.78rem; color: var(--muted); }

  .cifra {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 20px 18px; white-space: pre-wrap; line-height: 2.3; font-size: 1.2rem;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-weight: 500; box-shadow: 0 1px 3px rgba(20,30,20,0.05);
  }
  .chord {
    display: inline-block;
    background: rgba(30, 107, 63, 0.12);
    color: var(--accent);
    font-weight: 700;
    font-size: 0.68em;
    padding: 1px 7px;
    border-radius: 6px;
    margin: 0 3px 3px 0;
    vertical-align: 4px;
  }
  .structure-tag {
    display: block;
    margin: 14px 0 6px;
    padding: 5px 12px;
    background: rgba(196, 138, 23, 0.14);
    color: #96650f;
    font-weight: 800;
    font-size: 0.62em;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-radius: 6px;
    width: fit-content;
  }
  #print-cifra { display: none; }
  @media print {
    header, .links-row, #edit-cifra-box, .back-btn, #v-cifra,
    #view > button, .tone-control button { display: none !important; }
    body { padding-bottom: 0; }
    #print-cifra {
      display: block; box-shadow: none; border: none; padding: 0;
      white-space: pre-wrap; line-height: 1.55; font-size: 0.85rem;
    }
    #print-cifra .chord { padding: 0 4px; margin: 0 1px 0 0; }
    #print-cifra .structure-tag { margin: 8px 0 3px; padding: 2px 8px; }
  }

  .song-item.status-bem { background: rgba(30, 107, 63, 0.08); border-color: rgba(30, 107, 63, 0.3); }
  .song-item.status-mal { background: rgba(196, 138, 23, 0.10); border-color: rgba(196, 138, 23, 0.35); }
  .song-item.status-nao { background: rgba(196, 60, 60, 0.08); border-color: rgba(196, 60, 60, 0.28); }
  .status-label { font-size: 0.78rem; margin-top: 2px; font-weight: 600; }
  .st-bem { color: #1e7a45; }
  .st-mal { color: #96650f; }
  .st-nao { color: #b23f3f; }
  .new-badge {
    display: inline-block; background: var(--accent-2); color: #ffffff;
    font-size: 0.68rem; font-weight: 700; padding: 1px 7px; border-radius: 8px;
    margin-left: 6px; vertical-align: middle;
  }
</style>
</head>
<script src="config.js"></script>

  <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
    <a class="home-link" href="index.html">← Início</a>
    <div style="display:flex;gap:8px;">
      <a href="sugestoes.html" style="font-size:0.8rem;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--border);padding:6px 12px;border-radius:20px;white-space:nowrap;">💡 Sugestões</a>
      <a href="admin.html" style="font-size:0.8rem;font-weight:700;color:var(--accent);text-decoration:none;border:1px solid var(--border);padding:6px 12px;border-radius:20px;white-space:nowrap;">+ Nova música</a>

<script>
/* =========================================================================
   EDITE AQUI — dados das músicas.
   Cada música é um objeto com:
   - title: nome da música
   - originalKey: tom original (ex: "G", "Am", "D"). Deixe "" se ainda não souber.
   - presets: tom de cada cantor nessa música (ex: { Ricardo: "G", Karine: "G", "Luís": "C" })
   - videoCompleta: link de referência da versão completa (opcional, pode deixar "")
   - videoCongregacional: link de referência da versão congregacional (opcional, pode deixar "")
   - chordpro: a letra com os acordes colados entre colchetes, ex: "[G]Te agradeço [D]Senhor"
     use \n para quebra de linha dentro da string. Deixe "" se ainda não cadastrou.
   - status: "bem" (verde), "mal" (amarelo) ou "nao" (vermelho, ainda não ensaiada) —
     muda tocando no rótulo de status direto na lista (não precisa editar aqui).
   - isNew: true para músicas novas sendo inseridas/testadas, false para repertório fixo

   Dica: em vez de editar isso na mão, use o admin.html — ele gera o bloco pronto
   pra colar aqui a partir de um formulário.
   ========================================================================= */
/* =========================================================================
   CONFIGURAÇÃO — só isso aqui precisa ser editado uma vez.
   Depois de subir o repositório pro GitHub e ligar o GitHub Pages, troque
   a linha abaixo pela URL real do seu dados.json, no formato:
   https://raw.githubusercontent.com/SEU-USUARIO/SEU-REPO/main/dados.json
   ========================================================================= */
const DADOS_URL = API_URL + "?sheet=Musicas"; // vem da planilha, ao vivo — ver config.js

let SONGS = [];

/* ===================== lógica de transposição — não precisa mexer ===================== */

const SHARPS = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
const FLAT_TO_SHARP = { "Db":"C#","Eb":"D#","Gb":"F#","Ab":"G#","Bb":"A#" };

function noteIndex(note) {
  if (FLAT_TO_SHARP[note]) note = FLAT_TO_SHARP[note];
  return SHARPS.indexOf(note);
}

function transposeNote(note, semitones) {
  const idx = noteIndex(note);
  if (idx === -1) return note;
  return SHARPS[(idx + semitones + 120) % 12];
}

function transposeChord(chord, semitones) {
  // separa acorde principal e baixo (acorde/baixo)
  const parts = chord.split("/");
  const transposed = parts.map((part, i) => {
    const m = part.match(/^([A-G](?:#|b)?)(.*)$/);
    if (!m) return part;
    const [, root, suffix] = m;
    return transposeNote(root, semitones) + suffix;
  });
  return transposed.join("/");
}

function transposeChordPro(text, semitones) {
  // Só transpõe se for acorde de verdade — senão marcadores de estrutura que
  // começam com letra de nota (ex: "[Break]") viravam acorde por engano.
  return text.replace(/\[([^\]]+)\]/g, (m, content) => {
    if (!isChordToken(content)) return m;
    return "[" + transposeChord(content, semitones) + "]";
  });
}

// Acorde de verdade vira badge pequeno; qualquer outra coisa entre colchetes
// ([Intro], [Solo], [Break], [Repete 2x], [Volta do início]...) é marcador de
// estrutura e fica destacado num bloco separado, fácil de ver durante o culto.
const CHORD_RE = /^[A-G](#|b)?(m7b5|m7|m9|m6|m|maj7|maj9|maj|min7|min9|min|dim7|dim|aug|sus4|sus2|sus|add9|add2|add|6|7|9|11|13|4|2|5)?(\/[A-G](#|b)?)?$/;
function isChordToken(tok) { return CHORD_RE.test(tok.trim()); }

function renderChordProToHTML(text) {
  const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return escaped.replace(/\[([^\]]+)\]/g, (_, content) => {
    if (isChordToken(content)) return `<span class="chord">${content}</span>`;
    return `<span class="structure-tag">${content}</span>`;
  });
}

function semitonesBetweenKeys(fromKey, toKey) {
  const fromMatch = (fromKey || "").match(/^[A-G](#|b)?/);
  const toMatch = (toKey || "").match(/^[A-G](#|b)?/);
  if (!fromMatch || !toMatch) return 0;
  const fi = noteIndex(fromMatch[0]), ti = noteIndex(toMatch[0]);
  if (fi === -1 || ti === -1) return 0;
  return (ti - fi + 12) % 12;
}

/* ===================== estado e UI ===================== */

let current = null;      // música aberta
let activeSinger = null; // nome do cantor selecionado
let manualOffset = 0;    // ajuste manual em cima do preset

let currentFilter = "todas";

function setFilter(f) {
  currentFilter = f;
  document.querySelectorAll(".filter-btn").forEach(b => b.classList.toggle("active", b.dataset.f === f));
  renderList();
}

// ── Filtro alfabético: por título da música ou por banda/artista (a parte
// depois de " - " no título, ex: "Renova-me - Aline Barros" → "Aline Barros"). ──
let alphaMode = "title";
let alphaLetter = null;

function songArtist(title) {
  const idx = title.indexOf(" - ");
  return idx === -1 ? "" : title.slice(idx + 3).trim();
}

function setAlphaMode(mode) {
  alphaMode = mode;
  alphaLetter = null;
  document.getElementById("alpha-mode-title").classList.toggle("active", mode === "title");
  document.getElementById("alpha-mode-artist").classList.toggle("active", mode === "artist");
  renderAlphaRow();
  renderList();
}

function renderAlphaRow() {
  const letters = new Set();
  SONGS.forEach(s => {
    const val = alphaMode === "title" ? s.title : songArtist(s.title);
    if (val) letters.add(val[0].toUpperCase());
  });
  const sorted = [...letters].sort();
  const row = document.getElementById("alpha-row");
  row.innerHTML = `<button type="button" class="filter-btn${!alphaLetter ? " active" : ""}" data-letter="">Todas</button>` +
    sorted.map(l => `<button type="button" class="filter-btn${alphaLetter === l ? " active" : ""}" data-letter="${l}">${l}</button>`).join("");
  row.querySelectorAll("button").forEach(btn => {
    btn.onclick = () => {
      alphaLetter = btn.dataset.letter || null;
      renderAlphaRow();
      renderList();
    };
  });
}

const STATUS_ORDER = ["nao", "mal", "bem"];
const STATUS_TEXT = { bem: "Ensaiada", mal: "Ensaiar", nao: "Não ensaiada" };
const STATUS_CLASS = { bem: "st-bem", mal: "st-mal", nao: "st-nao" };

// Toca no rótulo de status → salva direto na planilha (POST em text/plain pra
// não disparar preflight CORS, que o Apps Script não responde). Otimista: já
// atualiza a tela, e desfaz se a gravação falhar.
async function cycleStatus(realIdx, ev) {
  ev.stopPropagation();
  const song = SONGS[realIdx];
  const prev = song.status || "nao";
  const i = STATUS_ORDER.indexOf(prev);
  const next = STATUS_ORDER[(i + 1) % STATUS_ORDER.length];
  song.status = next;
  renderList();
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "updateMusica", matchTitle: song.title, status: next }),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "falha ao salvar");
  } catch (e) {
    song.status = prev;
    renderList();
    alert("Não consegui salvar o status agora (" + e.message + "). Confira sua internet e tenta de novo.");
  }
}

function renderList() {
  const q = document.getElementById("search").value.toLowerCase();
  const list = document.getElementById("song-list");
  list.innerHTML = "";
  SONGS.forEach((song, realIdx) => song._idx = realIdx); // guarda índice real antes de filtrar
  SONGS
    .filter(s => s.title.toLowerCase().includes(q) || (s.chordpro || "").toLowerCase().includes(q))
    .filter(s => currentFilter === "todas" || (currentFilter === "novas" ? s.isNew : !s.isNew))
    .filter(s => {
      if (!alphaLetter) return true;
      const val = alphaMode === "title" ? s.title : songArtist(s.title);
      return val && val[0].toUpperCase() === alphaLetter;
    })
    .forEach(song => {
      const el = document.createElement("div");
      el.className = "song-item status-" + (song.status || "nao");

      const info = document.createElement("div");
      info.className = "song-item-info";
      info.onclick = () => openSong(song._idx);
      info.innerHTML = `<div class="song-item-title">${song.title}${song.isNew ? '<span class="new-badge">NOVA</span>' : ''}</div>
        <div class="tag">Tom: ${song.originalKey || "?"}</div>`;
      el.appendChild(info);

      const statusBtn = document.createElement("button");
      statusBtn.className = "status-label " + (STATUS_CLASS[song.status] || "st-nao");
      statusBtn.style.cssText = "background:none;border:none;cursor:pointer;padding:4px 2px;text-align:right;";
      statusBtn.textContent = STATUS_TEXT[song.status] || STATUS_TEXT.nao;
      statusBtn.title = "Toca pra mudar o status";
      statusBtn.onclick = (ev) => cycleStatus(song._idx, ev);
      const statusWrap = document.createElement("div");
      statusWrap.className = "song-actions";
      statusWrap.appendChild(statusBtn);

      const actionsRow = document.createElement("div");
      actionsRow.style.cssText = "display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;";

      function actionPill(text, title, onclick) {
        const b = document.createElement("button");
        b.textContent = text; b.title = title;
        b.style.cssText = "font-size:0.68rem;font-weight:600;color:var(--muted);background:var(--card-2);border:1px solid var(--border);border-radius:20px;padding:4px 9px;cursor:pointer;white-space:nowrap;";
        b.onclick = (ev) => { ev.stopPropagation(); onclick(); };
        return b;
      }

      if (song.videoCompleta) actionsRow.appendChild(actionPill("▶ Versão completa", "Vídeo — versão completa", () => window.open(song.videoCompleta, "_blank")));
      if (song.videoCongregacional) actionsRow.appendChild(actionPill("🎤 Versão congregacional", "Vídeo — versão congregacional", () => window.open(song.videoCongregacional, "_blank")));
      actionsRow.appendChild(actionPill("✏️ Editar", "Editar esta música", () => location.href = "admin.html?title=" + encodeURIComponent(song.title)));

      statusWrap.appendChild(actionsRow);
      el.appendChild(statusWrap);
      list.appendChild(el);
    });
}

function openSong(idx) {
  current = SONGS[idx];
  activeSinger = Object.keys(current.presets || {})[0] || null;
  manualOffset = 0;
  document.getElementById("song-list").style.display = "none";
  document.querySelector("header").style.display = "none";
  document.getElementById("view").classList.add("active");
  document.getElementById("v-title").textContent = current.title;
  document.getElementById("v-meta").textContent = "Tom original: " + (current.originalKey || "não definido");

  const singerRow = document.getElementById("v-singers");
  singerRow.innerHTML = "";
  Object.keys(current.presets || {}).forEach(name => {
    const btn = document.createElement("button");
    btn.className = "singer-btn" + (name === activeSinger ? " active" : "");
    btn.textContent = name;
    btn.onclick = () => selectSinger(name);
    singerRow.appendChild(btn);
  });

  const linksRow = document.getElementById("v-links");
  linksRow.innerHTML = "";
  if (current.videoCompleta) linksRow.innerHTML += `<a href="${current.videoCompleta}" target="_blank">▶ Versão completa</a>`;
  if (current.videoCongregacional) linksRow.innerHTML += `<a href="${current.videoCongregacional}" target="_blank">🎤 Versão congregacional</a>`;

  cancelEditCifra();
  updateView();
}

function closeSong() {
  current = null;
  document.getElementById("view").classList.remove("active");
  document.getElementById("song-list").style.display = "flex";
  document.querySelector("header").style.display = "block";
}

async function deleteSong() {
  if (!current) return;
  if (!confirm(`Excluir "${current.title}"? Isso apaga a linha na planilha, não tem como desfazer.`)) return;
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "deleteMusica", title: current.title }),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "falha ao excluir");
    SONGS = SONGS.filter(s => s.title !== current.title);
    closeSong();
    renderList();
  } catch (e) {
    alert("Não deu pra excluir agora (" + e.message + "). Tenta de novo.");
  }
}

// ── Editar a cifra direto na tela de visualização ───────────────────────────

// Limpa lixo de HTML que às vezes vem junto quando se copia texto de uma
// página já renderizada (tags inteiras, ou só o resto de uma tag cortada).
function sanitizeRaw(text) {
  return text
    .replace(/<[^>]*>/g, "")
    .replace(/"\s*>/g, "")
    .replace(/&amp;/g, "&").replace(/&lt;/g, "<").replace(/&gt;/g, ">")
    .replace(/&quot;/g, '"').replace(/&#39;/g, "'");
}

function isChordLine(line) {
  const trimmed = line.trim();
  if (!trimmed) return false;
  const tokens = trimmed.split(/\s+/);
  const hits = tokens.filter(isChordToken).length;
  return hits / tokens.length >= 0.6;
}

function mergeChordIntoLyric(chordLine, lyricLine) {
  const matches = [];
  const re = /\S+/g;
  let m;
  while ((m = re.exec(chordLine)) !== null) matches.push({ text: m[0], col: m.index });
  let result = lyricLine;
  for (let i = matches.length - 1; i >= 0; i--) {
    const insertAt = Math.min(matches[i].col, result.length);
    result = result.slice(0, insertAt) + `[${matches[i].text}]` + result.slice(insertAt);
  }
  return result;
}

// Detecta se o texto colado já está em ChordPro (colchete perto de letra) ou
// se é o formato "acorde em cima da linha" — só converte nesse segundo caso,
// pra não estragar uma cifra que já tinha sido colada certa antes.
function looksAlreadyBracketed(text) {
  return (text.match(/\[[^\]]{1,12}\]/g) || []).length >= 2;
}

function stripChords(line) {
  return line.replace(/\[[^\]]+\]/g, "").trim();
}

// Alguns sites (Cifra Club incluso) colam a mesma linha duas vezes — uma
// com o acorde marcado, outra "limpa" — por causa de como a página é
// montada (versão com/sem cifra no mesmo bloco de texto). Detecta quando
// duas linhas seguidas são a mesma letra (ignorando os acordes) e mantém
// só uma — de preferência a que tiver o acorde.
function dedupeChordLines(lines) {
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    const next = lines[i + 1];
    if (next !== undefined) {
      const a = stripChords(line);
      const b = stripChords(next);
      if (a && a === b) {
        out.push(/\[[^\]]+\]/.test(line) ? line : next);
        i++;
        continue;
      }
    }
    out.push(line);
  }
  return out;
}

function convertCifraText(raw) {
  const lines = raw.replace(/\r\n/g, "\n").split("\n");
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (isChordLine(line)) {
      const next = lines[i + 1];
      if (next !== undefined && next.trim() !== "" && !isChordLine(next)) {
        out.push(mergeChordIntoLyric(line, next));
        i++;
      } else {
        out.push(line.trim().split(/\s+/).map(c => `[${c}]`).join(" "));
      }
    } else {
      out.push(line);
    }
  }
  return dedupeChordLines(out).join("\n");
}

document.getElementById("edit-cifra-text").addEventListener("paste", function (e) {
  const raw = (e.clipboardData || window.clipboardData).getData("text");
  if (!raw) return;
  e.preventDefault();
  const cleaned = sanitizeRaw(raw);
  const finalText = looksAlreadyBracketed(cleaned) ? cleaned : convertCifraText(cleaned);
  const ta = this;
  const start = ta.selectionStart, end = ta.selectionEnd;
  ta.value = ta.value.slice(0, start) + finalText + ta.value.slice(end);
  const pos = start + finalText.length;
  ta.setSelectionRange(pos, pos);
});

document.querySelectorAll(".tag-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    const ta = document.getElementById("edit-cifra-text");
    const tag = btn.dataset.tag;
    const start = ta.selectionStart, end = ta.selectionEnd;
    const before = ta.value.slice(0, start), after = ta.value.slice(end);
    const needsNewlineBefore = before.length > 0 && !before.endsWith("\n");
    const insert = (needsNewlineBefore ? "\n" : "") + tag + "\n";
    ta.value = before + insert + after;
    const pos = (before + insert).length;
    ta.focus();
    ta.setSelectionRange(pos, pos);
  });
});

function toggleEditCifra() {
  if (!current) return;
  document.getElementById("v-cifra").style.display = "none";
  document.getElementById("edit-cifra-toggle").style.display = "none";
  document.getElementById("edit-cifra-box").style.display = "block";
  document.getElementById("edit-cifra-text").value = current.chordpro || "";
  document.getElementById("edit-cifra-msg").textContent = "";
}

function cancelEditCifra() {
  document.getElementById("v-cifra").style.display = "block";
  document.getElementById("edit-cifra-toggle").style.display = "inline-block";
  document.getElementById("edit-cifra-box").style.display = "none";
}

async function saveEditCifra() {
  const newChordpro = document.getElementById("edit-cifra-text").value;
  const btn = document.getElementById("save-cifra-btn");
  const msg = document.getElementById("edit-cifra-msg");
  btn.disabled = true; btn.textContent = "Salvando…";
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "updateMusica", matchTitle: current.title, chordpro: newChordpro }),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "falha ao salvar");
    current.chordpro = newChordpro;
    const song = SONGS.find(s => s.title === current.title);
    if (song) song.chordpro = newChordpro;
    updateView();
    cancelEditCifra();
  } catch (e) {
    msg.style.color = "#b23f3f";
    msg.textContent = "Não deu pra salvar: " + e.message;
  } finally {
    btn.disabled = false; btn.textContent = "Salvar";
  }
}

// ── Baixar (.txt) e imprimir (mais enxuto: trechos repetidos viram "(repete)") ──
function currentTransposedText() {
  if (!current) return "";
  const presetKey = activeSinger ? current.presets[activeSinger] : current.originalKey;
  const baseSemitones = semitonesBetweenKeys(current.originalKey, presetKey);
  const totalSemitones = (baseSemitones + manualOffset + 120) % 12;
  return transposeChordPro(current.chordpro || "", totalSemitones);
}

function downloadCifra() {
  if (!current) return;
  const tone = document.getElementById("v-tone").textContent;
  const titleEsc = current.title.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const bodyHtml = renderChordProToHTML(buildPrintCifra(currentTransposedText()));
  const html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>${titleEsc}</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; max-width: 640px; margin: 0 auto; padding: 24px 20px 60px; color: #1c2620; background: #f5f7f4; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .meta { color: #5c665f; font-size: 0.9rem; margin: 0 0 20px; }
  .cifra { white-space: pre-wrap; line-height: 2.1; font-size: 1.1rem; background: #fff; border: 1px solid #dde3da; border-radius: 14px; padding: 20px 18px; }
  .chord { display: inline-block; background: rgba(30,107,63,0.12); color: #1e6b3f; font-weight: 700; font-size: 0.68em; padding: 1px 7px; border-radius: 6px; margin: 0 3px 3px 0; vertical-align: 4px; }
  .structure-tag { display: block; margin: 14px 0 6px; padding: 5px 12px; background: rgba(196,138,23,0.14); color: #96650f; font-weight: 800; font-size: 0.62em; text-transform: uppercase; letter-spacing: 0.05em; border-radius: 6px; width: fit-content; }
  @media print { body { background: #fff; } .cifra { border: none; padding: 0; } }
</style>
</head>
<body>
  <h1>${titleEsc}</h1>
  <p class="meta">Tom: ${tone}</p>
  <div class="cifra">${bodyHtml}</div>
</body>
</html>`;
  const blob = new Blob([html], { type: "text/html;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = current.title.replace(/[\/\\?%*:|"<>]/g, "-") + ".html";
  a.click();
  URL.revokeObjectURL(url);
}

// Bloco (trecho entre linhas em branco) idêntico ao anterior vira "(repete)" —
// evita imprimir o refrão inteiro de novo cada vez que ele se repete.
function buildPrintCifra(text) {
  const stanzas = text.split(/\n\s*\n+/);
  const out = [];
  let lastTrimmed = null;
  for (const st of stanzas) {
    const trimmed = st.trim();
    out.push(trimmed && trimmed === lastTrimmed ? "(repete)" : st);
    lastTrimmed = trimmed;
  }
  return out.join("\n\n");
}

window.addEventListener("beforeprint", () => {
  if (!current) return;
  document.getElementById("print-cifra").innerHTML = renderChordProToHTML(buildPrintCifra(currentTransposedText()));
});

function selectSinger(name) {
  activeSinger = name;
  manualOffset = 0;
  document.querySelectorAll(".singer-btn").forEach(b => {
    b.classList.toggle("active", b.textContent === name);
  });
  updateView();
}

function adjustTone(delta) {
  manualOffset += delta;
  updateView();
}

function updateView() {
  if (!current) return;
  const presetKey = activeSinger ? current.presets[activeSinger] : current.originalKey;
  const baseSemitones = semitonesBetweenKeys(current.originalKey, presetKey);
  const totalSemitones = (baseSemitones + manualOffset + 120) % 12;
  const rootMatch = (current.originalKey || "").match(/^[A-G](#|b)?/);
  document.getElementById("v-tone").textContent = rootMatch
    ? transposeNote(rootMatch[0], totalSemitones) + current.originalKey.replace(/^[A-G](#|b)?/, "")
    : "—";
  if (!current.chordpro) {
    document.getElementById("v-cifra").innerHTML = "<em>Cifra ainda não cadastrada para esta música.</em>";
    return;
  }
  const transposedText = transposeChordPro(current.chordpro, totalSemitones);
  document.getElementById("v-cifra").innerHTML = renderChordProToHTML(transposedText);
}

async function loadData() {
  const list = document.getElementById("song-list");
  list.innerHTML = "<p style='color:var(--muted);padding:8px 0;'>Carregando músicas...</p>";
  try {
    const res = await fetch(DADOS_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    SONGS = await res.json();
  } catch (e) {
    list.innerHTML = `<p style='color:#e88a8a;padding:8px 0;'>Não consegui carregar dados.json (${e.message}). Confira se o arquivo está na mesma pasta ou se a URL em DADOS_URL está certa.</p>`;
    return;
  }
  renderAlphaRow();
  renderList();

  // Link direto de outra página (ex: Ensaios) — ?song=Nome&singer=Nome abre
  // a música já no tom daquele cantor, sem precisar buscar na lista.
  const params = new URLSearchParams(location.search);
  const wantSong = params.get("song");
  if (wantSong) {
    const idx = SONGS.findIndex(s => s.title === wantSong);
    if (idx !== -1) {
      openSong(idx);
      const wantSinger = params.get("singer");
      if (wantSinger && current.presets && current.presets[wantSinger]) selectSinger(wantSinger);
    }
  }
}

loadData();
