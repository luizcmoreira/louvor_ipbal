<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Nova escala (uso pessoal)</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; background:#f5f7f4; color:#1c2620; padding:16px; max-width:640px; margin:0 auto; }
  .home-link { display:inline-flex; align-items:center; gap:4px; color:#1e6b3f; text-decoration:none; font-size:0.82rem; font-weight:700; }
  h1 { font-size:1.1rem; margin-top:14px; }
  label { display:block; margin-top:14px; font-size:0.85rem; color:#5c665f; }
  input, select { width:100%; padding:9px; border-radius:8px; border:1px solid #dde3da; background:#ffffff; color:#1c2620; font-size:0.95rem; box-sizing:border-box; }
  input:focus, select:focus { outline:none; border-color:#1e6b3f; box-shadow:0 0 0 3px rgba(30,107,63,0.15); }
  .check-grid { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .check-grid label {
    display:flex; align-items:center; gap:6px; margin-top:0; font-size:0.88rem; color:#1c2620;
    border:1px solid #dde3da; border-radius:20px; padding:7px 12px; background:#ffffff; cursor:pointer;
  }
  .check-grid input { width:auto; }
  .musico-row {
    display:flex; align-items:center; gap:10px; border:1px solid #dde3da; border-radius:12px;
    padding:9px 12px; margin-top:8px; background:#ffffff;
  }
  .musico-row label { margin-top:0; display:flex; align-items:center; gap:8px; font-size:0.9rem; color:#1c2620; flex:1; }
  .musico-row input[type=checkbox] { width:auto; }
  .musico-row select { flex:1; opacity:0.4; }
  .musico-row select:not(:disabled) { opacity:1; }
  button { margin-top:18px; padding:12px 18px; border-radius:8px; border:none; background:#1e6b3f; color:#ffffff; font-weight:700; font-size:1rem; cursor:pointer; width:100%; }
  #out { margin-top:16px; white-space:pre-wrap; background:#eef2ec; border:1px solid #dde3da; border-radius:8px; padding:12px; font-family: ui-monospace, monospace; font-size:0.85rem; }
  .copybtn { background:#ffffff; color:#1c2620; border:1px solid #dde3da; margin-top:8px; }
  .hint { font-size:0.78rem; color:#5c665f; margin-top:4px; }
</style>
</head>
<script src="config.js"></script>
<body>
<a class="home-link" href="escala.html">← Escala</a>
<h1>Adicionar culto na escala</h1>

<label>Data</label>
<input type="date" id="date">

<label>Descrição</label>
<input id="label" placeholder="Ex: Culto de domingo à noite">

<label>Ministro (voz principal)</label>
<select id="ministro"></select>

<label>Músicos</label>
<div id="musicos"></div>

<label>Vocal (backing)</label>
<div class="check-grid" id="backing"></div>

<label>Repertório</label>
<div class="check-grid" id="repertorio"></div>
<p class="hint">O tom mostrado na Escala/Ensaios é o do ministro selecionado acima (ou o tom original, se não houver preset dele pra essa música).</p>

<button onclick="salvar()" id="save-btn">Salvar na escala</button>
<p id="msg" style="text-align:center;font-size:0.85rem;margin-top:10px;"></p>

<script>
let people = [], songs = [];

async function init() {
  try {
    [people, songs] = await Promise.all([
      fetch(API_URL + "?sheet=Participantes", { cache: "no-store" }).then(r => r.json()),
      fetch(API_URL + "?sheet=Musicas", { cache: "no-store" }).then(r => r.json()),
    ]);
  } catch (e) {
    document.getElementById("musicos").innerHTML = "<p style='color:#b23f3f'>Não consegui carregar os dados. Confira o config.js.</p>";
    return;
  }

  const ministros = people.filter(p => p.vocal === "ministro" || p.vocal === "ministra");
  document.getElementById("ministro").innerHTML = ministros.map(p => `<option value="${p.name}">${p.name}</option>`).join("");

  const musicos = people.filter(p => (p.instrumentos || []).length > 0);
  document.getElementById("musicos").innerHTML = musicos.map(p => {
    const opts = p.instrumentos.map(i => `<option value="${i}">${i}</option>`).join("");
    return `<div class="musico-row">
      <label><input type="checkbox" value="${p.name}" class="musico-cb" onchange="toggleMusico(this)"> ${p.name}</label>
      <select class="musico-instrumento" data-name="${p.name}" disabled>${opts}</select>
    </div>`;
  }).join("");

  const backing = people.filter(p => p.vocal === "backing");
  document.getElementById("backing").innerHTML = backing.map(p =>
    `<label><input type="checkbox" value="${p.name}" class="backing-cb"> ${p.name}</label>`).join("");

  document.getElementById("repertorio").innerHTML = songs.map(s =>
    `<label><input type="checkbox" value="${s.title}" class="rep-cb"> ${s.title}</label>`).join("");
}
init();

function esc(s) { return (s || "").replace(/\\/g,"\\\\").replace(/"/g,'\\"'); }
function checked(cls) { return [...document.querySelectorAll("." + cls + ":checked")].map(el => el.value); }

function toggleMusico(cb) {
  const row = cb.closest(".musico-row");
  row.querySelector(".musico-instrumento").disabled = !cb.checked;
}

function musicosEscolhidos() {
  return [...document.querySelectorAll(".musico-cb:checked")].map(cb => {
    const row = cb.closest(".musico-row");
    return { name: cb.value, instrumento: row.querySelector(".musico-instrumento").value };
  });
}

async function salvar() {
  const date = document.getElementById("date").value;
  if (!date) { alert("Escolhe a data do culto."); return; }
  const musicos = musicosEscolhidos().map(m => `${m.name}:${m.instrumento}`).join(", ");
  const entry = {
    action: "addEscala",
    date,
    label: document.getElementById("label").value,
    ministro: document.getElementById("ministro").value,
    musicos,
    vocalBacking: checked("backing-cb").join(", "),
    repertorio: checked("rep-cb").join(", "),
  };
  const btn = document.getElementById("save-btn");
  const msg = document.getElementById("msg");
  btn.disabled = true; btn.textContent = "Salvando…";
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(entry),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "falha ao salvar");
    msg.style.color = "#1e6b3f";
    msg.textContent = "Culto adicionado à escala!";
    setTimeout(() => location.href = "escala.html", 900);
  } catch (e) {
    msg.style.color = "#b23f3f";
    msg.textContent = "Não deu pra salvar: " + e.message;
    btn.disabled = false; btn.textContent = "Salvar na escala";
  }
}
</script>
</body>
</html>
