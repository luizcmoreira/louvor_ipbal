<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Nova escala (uso pessoal)</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; background:#f5f7f4; color:#1c2620; padding:16px; max-width:640px; margin:0 auto; }
  .home-link { display:inline-flex; align-items:center; gap:4px; color:#1e6b3f; text-decoration:none; font-size:0.82rem; font-weight:700; }
  h1 { font-size:1.1rem; margin-top:14px; }
  label { display:block; margin-top:14px; font-size:0.85rem; color:#5c665f; }
  input, select, textarea { width:100%; padding:9px; border-radius:8px; border:1px solid #dde3da; background:#ffffff; color:#1c2620; font-size:0.95rem; box-sizing:border-box; font-family:inherit; }
  .row3 { display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .row3 > div { flex:1 1 140px; }
  .row3 label { margin-top:0; }
  input:focus, select:focus { outline:none; border-color:#1e6b3f; box-shadow:0 0 0 3px rgba(30,107,63,0.15); }
  .check-grid { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .check-grid label {
    display:flex; align-items:center; gap:6px; margin-top:0; font-size:0.88rem; color:#1c2620;
    border:1px solid #dde3da; border-radius:20px; padding:7px 12px; background:#ffffff; cursor:pointer;
  }
  .check-grid input { width:auto; }
  .rep-mode-btn {
    width:auto; margin-top:0; padding:7px 12px; border-radius:20px; border:1px solid #dde3da;
    background:#ffffff; color:#5c665f; font-size:0.8rem; font-weight:600; cursor:pointer;
  }
  .rep-mode-btn.active { background:#1e6b3f; border-color:#1e6b3f; color:#fff; }
  .rep-letter-btn {
    width:auto; margin-top:0; min-width:30px; padding:5px 9px; border-radius:8px; border:1px solid #dde3da;
    background:#ffffff; color:#1c2620; font-size:0.78rem; font-weight:700; cursor:pointer;
  }
  .rep-letter-btn.active { background:#1e6b3f; border-color:#1e6b3f; color:#fff; }
  .musico-row {
    display:flex; align-items:center; gap:10px; border:1px solid #dde3da; border-radius:12px;
    padding:9px 12px; margin-top:8px; background:#ffffff;
  }
  .musico-row label { margin-top:0; display:flex; align-items:center; gap:8px; font-size:0.9rem; color:#1c2620; flex:1; }
  .musico-row input[type=checkbox] { width:auto; }
  .musico-row select { flex:1; opacity:0.4; }
  .musico-row select:not(:disabled) { opacity:1; }
  button { margin-top:18px; padding:12px 18px; border-radius:8px; border:none; background:#1e6b3f; color:#ffffff; font-weight:700; font-size:1rem; cursor:pointer; width:100%; }
  #out { margin-top:16px; white-space:pre-wrap; background:#eef2ec; border:1px solid #dde3da; border-radius:8px; padding:12px; font-family: ui-monospace, monospace; font-size:0.85rem; }
  .copybtn { background:#ffffff; color:#1c2620; border:1px solid #dde3da; margin-top:8px; }
  .hint { font-size:0.78rem; color:#5c665f; margin-top:4px; }
</style>
</head>
<script src="config.js"></script>
<body>
<a class="home-link" href="escala.html">← Escala</a>
<h1 id="page-title">Adicionar culto na escala</h1>

<label>Data</label>
<input type="date" id="date">

<label>Descrição</label>
<input id="label" placeholder="Ex: Culto de domingo à noite">

<label>Ministro (voz principal)</label>
<select id="ministro"></select>

<label>Músicos</label>
<div id="musicos"></div>

<label>Vocal (backing)</label>
<div class="check-grid" id="backing"></div>

<label>Repertório</label>
<div style="display:flex;gap:6px;margin-top:8px;">
  <button type="button" id="rep-mode-title" class="rep-mode-btn active">Por música</button>
  <button type="button" id="rep-mode-artist" class="rep-mode-btn">Por banda/artista</button>
</div>
<div id="rep-alpha" style="display:flex;flex-wrap:wrap;gap:4px;margin:8px 0;"></div>
<div class="check-grid" id="repertorio"></div>
<p class="hint">O tom mostrado na Escala/Ensaios é o do ministro selecionado acima (ou o tom original, se não houver preset dele pra essa música).</p>

<div class="row3">
  <div><label>Dia do ensaio</label><input type="date" id="ensaioData"></div>
  <div><label>Horário do ensaio</label><input type="time" id="ensaioHorario"></div>
</div>
<p class="hint">As observações antes/depois do ensaio agora se editam direto no card da Escala/Ensaios, sem precisar entrar aqui.</p>

<button onclick="salvar()" id="save-btn">Salvar na escala</button>
<button onclick="excluirCulto()" id="delete-btn" style="display:none;background:none;color:#b23f3f;font-weight:600;">Excluir culto</button>
<p id="msg" style="text-align:center;font-size:0.85rem;margin-top:10px;"></p>

<script>
let people = [], songs = [];
const params = new URLSearchParams(location.search);
const editDate = params.get("date");
const editLabel = params.get("label");
const isEditing = editDate !== null;

async function init() {
  try {
    [people, songs] = await Promise.all([
      fetch(API_URL + "?sheet=Participantes", { cache: "no-store" }).then(r => r.json()),
      fetch(API_URL + "?sheet=Musicas", { cache: "no-store" }).then(r => r.json()),
    ]);
  } catch (e) {
    document.getElementById("musicos").innerHTML = "<p style='color:#b23f3f'>Não consegui carregar os dados. Confira o config.js.</p>";
    return;
  }

  const ministros = people.filter(p => p.vocal === "ministro" || p.vocal === "ministra");
  document.getElementById("ministro").innerHTML = ministros.map(p => `<option value="${p.name}">${p.name}</option>`).join("");

  const musicos = people.filter(p => (p.instrumentos || []).length > 0);
  document.getElementById("musicos").innerHTML = musicos.map(p => {
    const opts = p.instrumentos.map(i => `<option value="${i}">${i}</option>`).join("");
    return `<div class="musico-row">
      <label><input type="checkbox" value="${p.name}" class="musico-cb" onchange="toggleMusico(this)"> ${p.name}</label>
      <select class="musico-instrumento" data-name="${p.name}" disabled>${opts}</select>
    </div>`;
  }).join("");

  // Backing pode ser qualquer um que canta — inclusive ministro, quando não
  // é ele quem lidera naquele culto específico.
  const backing = people.filter(p => !!p.vocal);
  document.getElementById("backing").innerHTML = backing.map(p =>
    `<label><input type="checkbox" value="${p.name}" class="backing-cb"> ${p.name}</label>`).join("");

  document.getElementById("repertorio").innerHTML = songs.map(s =>
    `<label><input type="checkbox" value="${s.title}" class="rep-cb"> ${s.title}</label>`).join("");
  renderRepAlpha();

  if (isEditing) await prefillEdit();
}
init();

// ── Filtro alfabético do repertório: por título da música ou por
// banda/artista (a parte depois de " - " no título, ex: "Renova-me -
// Aline Barros" → artista "Aline Barros"). ──────────────────────────────────
let repMode = "title";
let repLetterFilter = null;

function songArtist(title) {
  const idx = title.indexOf(" - ");
  return idx === -1 ? "" : title.slice(idx + 3).trim();
}

function renderRepAlpha() {
  const letters = new Set();
  songs.forEach(s => {
    const val = repMode === "title" ? s.title : songArtist(s.title);
    if (val) letters.add(val[0].toUpperCase());
  });
  const sorted = [...letters].sort();
  const alphaDiv = document.getElementById("rep-alpha");
  alphaDiv.innerHTML = `<button type="button" class="rep-letter-btn${!repLetterFilter ? " active" : ""}" data-letter="">Todas</button>` +
    sorted.map(l => `<button type="button" class="rep-letter-btn${repLetterFilter === l ? " active" : ""}" data-letter="${l}">${l}</button>`).join("");
  alphaDiv.querySelectorAll(".rep-letter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      repLetterFilter = btn.dataset.letter || null;
      renderRepAlpha();
      applyRepFilter();
    });
  });
}

function applyRepFilter() {
  document.querySelectorAll("#repertorio label").forEach(label => {
    const title = label.querySelector(".rep-cb").value;
    const val = repMode === "title" ? title : songArtist(title);
    const matches = !repLetterFilter || (val && val[0].toUpperCase() === repLetterFilter);
    label.style.display = matches ? "" : "none";
  });
}

document.getElementById("rep-mode-title").addEventListener("click", function () {
  repMode = "title"; repLetterFilter = null;
  this.classList.add("active");
  document.getElementById("rep-mode-artist").classList.remove("active");
  renderRepAlpha(); applyRepFilter();
});
document.getElementById("rep-mode-artist").addEventListener("click", function () {
  repMode = "artist"; repLetterFilter = null;
  this.classList.add("active");
  document.getElementById("rep-mode-title").classList.remove("active");
  renderRepAlpha(); applyRepFilter();
});

async function prefillEdit() {
  document.getElementById("page-title").textContent = "Editar culto";
  document.getElementById("save-btn").textContent = "Salvar alterações";
  document.getElementById("delete-btn").style.display = "block";
  let escala;
  try {
    escala = await fetch(API_URL + "?sheet=Escala", { cache: "no-store" }).then(r => r.json());
  } catch (e) {
    document.getElementById("msg").textContent = "Não consegui carregar o culto pra editar.";
    return;
  }
  const c = escala.find(x => x.date === editDate && (x.label || "") === (editLabel || ""));
  if (!c) { document.getElementById("msg").textContent = "Culto não encontrado."; return; }

  document.getElementById("date").value = c.date;
  document.getElementById("label").value = c.label || "";
  document.getElementById("ministro").value = c.ministro || "";

  (c.musicos || []).forEach(m => {
    const cb = document.querySelector(`.musico-cb[value="${CSS.escape(m.name)}"]`);
    if (cb) { cb.checked = true; toggleMusico(cb); const sel = cb.closest(".musico-row").querySelector(".musico-instrumento"); if (sel) sel.value = m.instrumento; }
  });
  (c.vocalBacking || []).forEach(name => {
    const cb = document.querySelector(`.backing-cb[value="${CSS.escape(name)}"]`);
    if (cb) cb.checked = true;
  });
  (c.repertorio || []).forEach(title => {
    const cb = document.querySelector(`.rep-cb[value="${CSS.escape(title)}"]`);
    if (cb) cb.checked = true;
  });

  document.getElementById("ensaioData").value = c.ensaioData || "";
  document.getElementById("ensaioHorario").value = c.ensaioHorario || "";
}

async function excluirCulto() {
  if (!confirm("Excluir este culto da escala? Não tem como desfazer.")) return;
  const btn = document.getElementById("delete-btn");
  btn.disabled = true; btn.textContent = "Excluindo…";
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "deleteEscala", date: editDate, label: editLabel }),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "falha ao excluir");
    location.href = "escala.html";
  } catch (e) {
    document.getElementById("msg").style.color = "#b23f3f";
    document.getElementById("msg").textContent = "Não deu pra excluir: " + e.message;
    btn.disabled = false; btn.textContent = "Excluir culto";
  }
}

function esc(s) { return (s || "").replace(/\\/g,"\\\\").replace(/"/g,'\\"'); }
function checked(cls) { return [...document.querySelectorAll("." + cls + ":checked")].map(el => el.value); }

function toggleMusico(cb) {
  const row = cb.closest(".musico-row");
  row.querySelector(".musico-instrumento").disabled = !cb.checked;
}

function musicosEscolhidos() {
  return [...document.querySelectorAll(".musico-cb:checked")].map(cb => {
    const row = cb.closest(".musico-row");
    return { name: cb.value, instrumento: row.querySelector(".musico-instrumento").value };
  });
}

async function salvar() {
  const date = document.getElementById("date").value;
  if (!date) { alert("Escolhe a data do culto."); return; }
  const musicos = musicosEscolhidos().map(m => `${m.name}:${m.instrumento}`).join(", ");
  const entry = {
    action: isEditing ? "updateEscala" : "addEscala",
    matchDate: editDate, matchLabel: editLabel,
    date,
    label: document.getElementById("label").value,
    ministro: document.getElementById("ministro").value,
    musicos,
    vocalBacking: checked("backing-cb").join(", "),
    repertorio: checked("rep-cb").join(", "),
    ensaioData: document.getElementById("ensaioData").value,
    ensaioHorario: document.getElementById("ensaioHorario").value,
  };
  const btn = document.getElementById("save-btn");
  const msg = document.getElementById("msg");
  btn.disabled = true; btn.textContent = "Salvando…";
  try {
    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(entry),
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || "falha ao salvar");
    msg.style.color = "#1e6b3f";
    msg.textContent = isEditing ? "Culto atualizado!" : "Culto adicionado à escala!";
    setTimeout(() => location.href = "escala.html", 900);
  } catch (e) {
    msg.style.color = "#b23f3f";
    msg.textContent = "Não deu pra salvar: " + e.message;
    btn.disabled = false; btn.textContent = isEditing ? "Salvar alterações" : "Salvar na escala";
  }
}
</script>
</body>
</html>
